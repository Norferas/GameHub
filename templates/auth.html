{% extends "base.html" %}
{% block content %}
<div class="auth card">
<h1>{{ "Criar conta" if mode == "register" else "Entrar" }}</h1>
<form method="post">
{% if mode == "register" %}
<input name="username" placeholder="Nome de usuário" required maxlength="40">
{% endif %}
<input name="email" type="email" placeholder="E-mail" required>
<input name="password" type="password" placeholder="Senha" required>
<button>{{ "Cadastrar" if mode == "register" else "Entrar" }}</button>
</form>
</div>
{% endblock %}
